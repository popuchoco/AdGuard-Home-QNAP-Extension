listen: "127.0.0.1:8787"
base_path: "/extension"
resource_budget:
  memory_limit_mb: 48
  default_refresh: "60s"
cache:
  jitter_percent: 10
  stale_max_age: "30m"
  max_response_bytes: 1048576

adguard:
  enabled: true
  base_url: "http://127.0.0.1:3000"
  username: "monitor"
  password_file: "/run/secrets/adguard_password"
  status_ttl: "15s"
  stats_ttl: "30s"

uptime_kuma:
  enabled: true
  base_url: "http://uptime-kuma:3001"
  status_page_slug: "home-network"
  heartbeat_ttl: "60s"

qts:
  enabled: true
  base_url: "https://nas.example"
  username: "monitor"
  password_file: "/run/secrets/qts_password"
  verify_tls: true
  system_ttl: "30s"
  storage_ttl: "5m"
  raid_ttl: "60s"
  ssh:
    enabled: false
    host: "nas.example"
    user: "monitor"
    identity_file: "/run/secrets/qts_ssh_key"

qurouter:
  mode: "uptime_kuma"
  ping_monitor_name: "QHora Ping"
  web_monitor_name: "QuRouter Web"
  management_url: "http://router.example"
